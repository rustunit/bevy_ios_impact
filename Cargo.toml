[package]
name = "bevy_ios_impact"
version = "0.9.0"
license = "MIT OR Apache-2.0"
description = "allows using ios ImpactFeedback API to generate haptic device vibrations"
authors = ["rusticorn <mail@rusticorn.com>"]
edition = "2024"
repository = "https://github.com/rustunit/bevy_ios_impact"
documentation = "https://docs.rs/bevy_ios_impact"
keywords = ["gamedev", "bevy", "ios", "mobile"]
categories = ["game-engines"]

[package.metadata.docs.rs]
default-target = "x86_64-apple-darwin"

[dependencies]
bevy_app = { version = "0.20", default-features = false }
bevy_ecs = { version = "0.20", default-features = false }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
# `objc2-core-foundation` is what gates `impactOccurredWithIntensity:` — 0.3 moved
# `CGFloat` there.
objc2-ui-kit = { version = "0.3", default-features = false, features = [
    "std",
    "UIFeedbackGenerator",
    "UIImpactFeedbackGenerator",
    "objc2-core-foundation",
] }
